<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Pokédex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="text-center mt-4 mb-4">

        <h1 class="titulo">
            <img src="{{ url_for('static', filename='images/Pokelogo.png') }}" width="60">
            Pokédex
        </h1>

        <h3>{{ titulo }}</h3>

        <div class="mt-3">

            <a href="{{ url_for('inicio') }}" class="btn btn-primary">
                Ver todos
            </a>

            <a href="{{ url_for('pokemon_cantidad', cantidad=5) }}" class="btn btn-success">
                Ver 5 primeros
            </a>

        </div>

    </div>

    <div class="row">

        {% for pokemon in pokemons %}

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <div class="imagen">

                    <span class="numero">
                        #{{ pokemon.id }}
                    </span>

                    <img
                        src="{{ url_for('static', filename='images/' + pokemon.imagen) }}"
                        class="card-img-top p-4"
                        alt="{{ pokemon.nombre }}">

                </div>

                <div class="card-body text-center">

                    <h3>{{ pokemon.nombre }}</h3>

                    {% set tipos = pokemon.tipo.split('/') %}

                    {% for tipo in tipos %}
                        <span class="badge tipo-{{ tipo|lower }}">
                        {{ tipo }}
                        </span>
                    {% endfor %}

                    <div class="mt-4">

                        <strong>Poder</strong>

                        <div class="progress">

                            <div class="progress-bar"
                                style="width: {{ pokemon.poder }}%">
                                {{ pokemon.poder }}
                            </div>

                        </div>

                    </div>

                    <div class="row mt-4">

                        <div class="col">

                            <strong>Altura</strong><br>
                            {{ pokemon.altura }}

                        </div>

                        <div class="col">

                            <strong>Peso</strong><br>
                            {{ pokemon.peso }}

                        </div>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
