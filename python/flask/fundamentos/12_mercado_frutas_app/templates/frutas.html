<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Mercado de Frutas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                🍎 Mercado de Frutas
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
                <a class="nav-link active" href="{{ url_for('frutas') }}">Catálogo</a>
            </div>
        </div>
    </nav>

        </div>
    </div>

            <div class="col">

                        <p class="card-text text-warning fw-bold">$4.5</p>
                    </div>

            </div>

            <div class="col">

                    <img src="{{ url_for('static', filename='images/uva.png') }}" class="card-img-top p-3 img-fluid-custom" alt="Uva">

                        <h5 class="card-title fw-bold">Uva</h5>
                        <p class="card-text text-warning fw-bold">$3.8</p>

                </div>

            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">

                        <p class="card-text text-warning fw-bold">$4.2</p>

            <div class="col">

                    <img src="{{ url_for('static', filename='images/mango.jpg') }}" class="card-img-top p-3 img-fluid-custom" alt="Mango">

        <div class="text-center mt-5">
