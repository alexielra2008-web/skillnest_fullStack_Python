<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <h2>Editar Usuario</h2>
        <form id="editUserForm">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="editName" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="editEmail" required readonly>
            </div>
            <div class="form-group">
                <label>Contraseña (Nueva)</label>
                <input type="password" id="editPassword" placeholder="Dejar en blanco para no cambiar">
            </div>
            <div class="form-group">
                <label>Tipo de Usuario</label>
                <select id="editRole">
                    <option value="Usuario">Usuario</option>
                    <option value="Admin">Administrador</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit">Guardar</button>
                <a href="admin_usuario.html" class="btn btn-danger">Volver</a>
            </div>
        </form>
    </div>
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadEditUserData);
    </script>
</body>
</html>
