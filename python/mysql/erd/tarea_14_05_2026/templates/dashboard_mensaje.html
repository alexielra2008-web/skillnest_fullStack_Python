<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensajes</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h2 id="messageTargetTitle">Mensajes a ...</h2>
            <button onclick="goBackDashboard()" class="btn">Volver al Dashboard</button>
        </div>

        <form id="postMessageForm" style="margin-bottom: 30px;">
            <div class="form-group">
                <input type="text" id="messageContent" placeholder="Escribe un mensaje..." required>
            </div>
            <button type="submit">Enviar Mensaje</button>
        </form>

        <h3>Muro de Mensajes</h3>
        <div id="messagesContainer">
            </div>
    </div>
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderMessagesWall);
    </script>
</body>
</html>
