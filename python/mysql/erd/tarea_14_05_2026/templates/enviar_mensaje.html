<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h2 id="welcomeUser">Dashboard</h2>
            <button onclick="logout()" class="btn btn-danger">Salir</button>
        </div>
        <p style="margin-bottom: 15px; color: #7f8c8d;">* Los usuarios solo pueden enviar mensajes.</p>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>E-mail</th>
                    <th>Tipo Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="userTable">
                </tbody>
        </table>
    </div>
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderUserTable);
    </script>
</body>
</html>
